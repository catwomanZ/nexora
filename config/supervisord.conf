[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/catwoman/supervisord.pid
childlogdir=/tmp

[program:nexora-panel]
priority=10
command=%(ENV_PANEL_BIN)s run
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NEXORA_STATE_DIR="%(ENV_CATWOMAN_PANEL_DIR)s",NEXORA_DB_DRIVER="sqlite",NEXORA_DB_DSN="%(ENV_CATWOMAN_DB_PATH)s",NEXORA_WEB_LISTEN="127.0.0.1:%(ENV_CATWOMAN_PANEL_PORT)s"

[program:nexora-node]
priority=20
command=%(ENV_NODE_BIN)s run
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NEXORA_STATE_DIR="%(ENV_CATWOMAN_NODE_DIR)s",NEXORA_NODE_LISTEN="127.0.0.1:%(ENV_CATWOMAN_NODE_PORT)s",NEXORA_NODE_CERT="%(ENV_CATWOMAN_CERT_DIR)s/ssl_cert.pem",NEXORA_NODE_KEY="%(ENV_CATWOMAN_CERT_DIR)s/ssl_key.pem",NEXORA_NODE_CLIENT_CA="%(ENV_CATWOMAN_CERT_DIR)s/panel_ca.pem"

[program:catwoman-sync]
priority=30
command=/usr/bin/python3 /usr/local/lib/catwoman/bootstrap.py sync
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:nginx]
priority=40
command=/usr/sbin/nginx -c /run/catwoman/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
